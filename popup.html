<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <title>Commitment Alerts</title>
      <link rel="stylesheet" type="text/css" href="assets/css/style.css">
      <script src="features.js"></script>
      <script src="libs/jquery/jquery-3.3.1.js"></script>
   </head>
   <body>
      <!-- href is the offline fallback; popup.js replaces it with the value
           from the config endpoint once Support Utilities is serving one, so
           the annually-changing URL stops needing a re-release. -->
      <p class="aligncenter"> <a title="Reopen Commitment Box (If there is one active)" href="https://raptor--icagentconsole.vf.force.com/apex/inContactCommitmentReminder?mode=" target="_blank" id="reopenCommitment"><img src="/icons/48x48.png" class="center"></a> <br></p>
      <p class="aligncenter"> <img src="/icons/title 230x32.png" class="center"><br></p>
      <br>
      <div class="switch_centered">
         <div class="onoffswitch"> <input type="checkbox" name="onoffswitch" class="onoffswitch-checkbox" id="enabledDisabled"> <label for="enabledDisabled" class="enabledDisabled-label"> Switch </label> </div>
      </div>
      <br>
      <div class="separator"> ____________________</div>
      <br>
      <div class="settings_frame"> <a href="#" id="settings" class="settings"><img class="setting_img" src="assets/images/settings.png"></a></div>

      <div id="link_settings">
         <!-- One card per setting. The value, the edit control and the reset
              control live together, so there is no separate input block and no
              global Save to wonder about. -->
         <div class="card" id="card_mytext">
            <div class="cardTitle">Commitment Alert</div>
            <div class="cardRow">
               <span class="cardValue" id="val_mytext"></span>
               <button class="iconBtn" data-edit="mytext" title="Change this alert">&#9998;</button>
               <button class="iconBtn danger" data-clear="mytext" title="Reset to the default sound">&#10006;</button>
            </div>
            <div class="cardEdit" id="edit_mytext">
               <input type="text" id="in_mytext" placeholder="https://">
               <button class="miniBtn" data-save="mytext">Save</button>
               <button class="miniBtn ghost" data-cancel="mytext">Cancel</button>
            </div>
            <label class="modeLabel"><input type="checkbox" data-mode="windowMode"> Open in a window</label>
            <div class="cardNote" id="note_mytext"></div>
         </div>

         <div class="card" id="card_chat_mytext">
            <div class="cardTitle">Chat Alert</div>
            <div class="cardRow">
               <span class="cardValue" id="val_chat_mytext"></span>
               <button class="iconBtn" data-edit="chat_mytext" title="Change this alert">&#9998;</button>
               <button class="iconBtn danger" data-clear="chat_mytext" title="Reset to the default sound">&#10006;</button>
            </div>
            <div class="cardEdit" id="edit_chat_mytext">
               <input type="text" id="in_chat_mytext" placeholder="https://">
               <button class="miniBtn" data-save="chat_mytext">Save</button>
               <button class="miniBtn ghost" data-cancel="chat_mytext">Cancel</button>
            </div>
            <label class="modeLabel"><input type="checkbox" data-mode="chat_windowMode"> Open in a window</label>
            <div class="cardNote" id="note_chat_mytext"></div>
         </div>

         <div class="card" id="card_tid_mytext">
            <div class="cardTitle">Telegram ID</div>
            <div class="cardRow">
               <span class="cardValue" id="val_tid_mytext"></span>
               <button class="iconBtn" data-edit="tid_mytext" title="Change your Telegram ID">&#9998;</button>
               <button class="iconBtn danger" data-clear="tid_mytext" title="Remove your Telegram ID">&#10006;</button>
            </div>
            <div class="cardEdit" id="edit_tid_mytext">
               <input type="text" id="in_tid_mytext" placeholder="numbers only">
               <button class="miniBtn" data-save="tid_mytext">Save</button>
               <button class="miniBtn ghost" data-cancel="tid_mytext">Cancel</button>
            </div>
         </div>

         <p id="Saved"></p>
         <div id="Buttons"> <button type="default">Reset everything</button> </div>
      </div>

      <p button type="button" class="collapsible" id="versionCheck"></p>
      <div class="content">
         <br><b> Note: </b> <br>Please have at least one window with Salesforce visible on screen else the chat alert will not work. <br><br><b> What's new: </b> <br>
         <div class="update"></div>
      </div>
      <script src="EnableDisable.js" charset="utf-8"></script><script src="popup.js" charset="utf-8"></script><script src="updatelog.js" charset="utf-8"></script>
   </body>
</html>
